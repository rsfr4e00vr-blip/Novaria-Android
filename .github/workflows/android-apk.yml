name: Build Novaria Android APK

on:
  push:
    paths:
      - ".github/workflows/android-apk.yml"
      - "Novaria_AoH2_SOURCE.zip"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source archive
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Extract and inspect project
        id: inspect
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source build-report
          unzip -q Novaria_AoH2_SOURCE.zip -d source
          find source -type f | sort > build-report/inspection.txt
          WRAPPER="$(find source -type f -name gradlew -print -quit || true)"
          SETTINGS="$(find source -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit || true)"
          if [ -n "$WRAPPER" ]; then ROOT="$(dirname "$WRAPPER")"
          elif [ -n "$SETTINGS" ]; then ROOT="$(dirname "$SETTINGS")"
          else echo "No Gradle project found" >> build-report/inspection.txt; exit 1
          fi
          echo "gradle_root=$ROOT" >> "$GITHUB_OUTPUT"

      - name: Set up modern Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ steps.inspect.outputs.gradle_root }}"
          sed -i 's/id("com.android.application") version "8.7.2"/id("com.android.application") version "8.9.1"/' build.gradle.kts
          sed -i 's/compileSdk = 35/compileSdk = 36/' app/build.gradle.kts
          BOOTSTRAP="app/src/main/java/com/novaria/aoh/gdx/NovariaGdxBootstrap.kt"
          if [ -f "$BOOTSTRAP" ]; then
            sed -i '/^import .*ShapeRenderer$/d' "$BOOTSTRAP"
            sed -i '/^package /a import com.badlogic.gdx.graphics.glutils.ShapeRenderer' "$BOOTSTRAP"
            sed -n '1,24p' "$BOOTSTRAP"
          fi
          if [ -f ./gradlew ]; then chmod +x ./gradlew; ./gradlew --no-daemon assembleDebug
          else gradle --no-daemon assembleDebug
          fi
          mkdir -p "$GITHUB_WORKSPACE/output"
          find . -type f -path '*/build/outputs/apk/*/*.apk' -exec cp {} "$GITHUB_WORKSPACE/output/Novaria.apk" \;

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Novaria-Android-APK
          path: output/Novaria.apk
          if-no-files-found: error

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Novaria-build-report
          path: build-report/inspection.txt
          if-no-files-found: ignore
