name: Import Novaria AoH2 project

on:
  push:
    paths:
      - "Novaria_AoH2_SOURCE.zip"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-project:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project into repository root
        shell: bash
        run: |
          set -euo pipefail
          test -f Novaria_AoH2_SOURCE.zip
          mkdir -p /tmp/novaria-source
          unzip -q Novaria_AoH2_SOURCE.zip -d /tmp/novaria-source
          cp -a /tmp/novaria-source/. .
          rm -f Novaria_AoH2_SOURCE.zip

      - name: Commit imported project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No project changes to commit."
          else
            git commit -m "Import Novaria AoH2 project source"
            git push
          fi
